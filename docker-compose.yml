version: '3.8'

services:
  xiangdu-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xiangdu-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENV=production
      # 默认主通道
      - DEFAULT_API_KEY=${DEFAULT_API_KEY}
      - DEFAULT_BASE_URL=${DEFAULT_BASE_URL:-https://api.deepseek.com}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-deepseek-flash}
      # ★ 系统级高可用兜底通道：Cloudflare Worker 跨境反代 Google Gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://gemini.trythis.pw/v1}
      - GEMINI_MODEL=${GEMINI_MODEL:-models/gemini-flash-latest}
      - PRIMARY_TIMEOUT_SECONDS=35.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
